# Runs the full verification matrix on Linux, which the developer machine cannot do
# (its Docker daemon is a remote host that is not always reachable, and WSL is not
# installed). PLAN.md §8 requires `npm audit` at every sprint end, and the
# token-store file-permission assertions only exercise their code path on POSIX.
#
# This workflow exists because of that gap. It is the ONLY place Linux is verified;
# nothing else in the repository assumes a Linux run.

name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A superseded run is cancelled rather than queued: it cannot change the result.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Matrix deliberately spans architectures: PLAN.md S7.4 requires the Dockerfile to
    # assume no CPU architecture, and this is the cheapest place to notice if a
    # dependency stops supporting one of them.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` installs exactly the committed lockfile and fails on drift between it and
      # package.json, which is the check that makes the audit result reproducible.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit

  smoke:
    # S7.6: the container image must actually start and serve. This builds the same
    # Dockerfile the operator would use, so a broken image fails here rather than in
    # production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t mcp-gateway:ci .

      - name: Start the gateway
        # The smoke script tests a RUNNING gateway, so the gateway needs its own container.
        # `docker run ... /app/scripts/smoke.sh` cannot work: the image's ENTRYPOINT is
        # `node dist/cli.js`, so that argument is appended to the entrypoint and the CLI
        # rejects it with "unknown command" (exit 2). Overriding --entrypoint would start
        # the SCRIPT, but then there would be no server for it to talk to.
        run: |
          docker run -d --name smoke-gw \
            -e GATEWAY_API_KEY=ci-smoke-key \
            -e GATEWAY_CONFIG=/app/spikes/smoke/gateway.json \
            mcp-gateway:ci serve

      - name: Wait for the gateway to be healthy
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' smoke-gw)" = "healthy" ]; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "gateway never became healthy"; docker logs smoke-gw; exit 1

      - name: Smoke test the built image
        run: docker exec -e GATEWAY_API_KEY=ci-smoke-key smoke-gw sh /app/scripts/smoke.sh

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke-gw

      - name: Remove the container
        if: always()
        run: docker rm -f smoke-gw