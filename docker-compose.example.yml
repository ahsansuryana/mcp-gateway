# mcp-gateway — example compose file.
#
# Copy to `docker-compose.yml` and edit. Never commit a copy holding real secrets.
#
# The gateway needs these environment variables (NAMES ONLY):
#   GATEWAY_API_KEY   the inbound static bearer key (D9)
#   GATEWAY_TOKEN_KEY base64 32-byte AES-256-GCM key, ONLY when an upstream uses OAuth
#   GATEWAY_HOME      where .mcp-gateway/ lives; set in the image to /home/node
#
# Generate the second with:  openssl rand -base64 32
#
# FIRST RUN — put a config in the volume before starting the gateway:
#
#   docker compose run --rm gateway init          # writes /home/node/.mcp-gateway/gateway.json
#   docker compose run --rm gateway validate      # optional: check it parses
#   docker compose up -d
#
# `init` never overwrites an existing file. GATEWAY_API_KEY and GATEWAY_TOKEN_KEY stay
# environment-based and are never written into the config file.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-gateway:local
    # NAMED VOLUME, never a host bind mount. Two reasons, both hard:
    #   - the Docker host is a REMOTE Armbian machine, so a Windows path cannot be mounted
    #     there at all (B-29);
    #   - a bind mount would hand the non-root `node` user whatever host permissions the
    #     directory happens to carry.
    # Docker seeds a fresh named volume from the image content at that path, including
    # ownership, which is why the Dockerfile creates /home/node/.mcp-gateway as `node`.
    # This one volume holds the config AND the encrypted token store.
    volumes:
      - gateway-home:/home/node
    environment:
      # Names only. Values belong in a .env file next to this one, which is git-ignored.
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY in .env}
      GATEWAY_TOKEN_KEY: ${GATEWAY_TOKEN_KEY:?set GATEWAY_TOKEN_KEY in .env}
      GATEWAY_HOME: /home/node
      PORT: "3000"
    ports:
      # Bound to loopback by default. Put a TLS-terminating reverse proxy in front and
      # change this only if the gateway must be directly reachable — see
      # docs/OPERATIONS.md for the deployment options.
      - "127.0.0.1:3000:3000"
    # Compose's own restart policy; the gateway's SIGTERM handling (PLAN.md S7.3) is what
    # makes this safe: it stops accepting, drains for up to 10s, then tears down upstreams.
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  gateway-home: